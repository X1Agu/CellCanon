name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
          python -m pip install -c environments/cpu-py311.lock.txt '.[dev]'
          python -m pip check
      - name: Test installed package
        run: |
          python -m cellcanon --help
          python tools/check_install.py
          python -m pytest -q -p no:cacheprovider
      - name: Run offline demonstration
        run: python -m cellcanon.demo --output "$RUNNER_TEMP/cellcanon-demo"
      - name: Build source and wheel packages
        run: python -m build
