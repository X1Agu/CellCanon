[build-system]
requires = ["setuptools==81.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cellcanon"
version = "2026.10"
description = "CellCanon main research workflow: Predict, Explain and Update"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/X1Agu/CellCanon"
Paper = "https://openreview.net/forum?id=fRua0VKGhz"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "build>=1.2,<2"]

[project.scripts]
cellcanon = "cellcanon.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cellcanon = ["protocols/*.json"]
"cellcanon.resources" = ["*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
